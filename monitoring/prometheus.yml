global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: lab28-api
    static_configs: [{targets: ["api:8000"]}]
    metrics_path: /metrics

  - job_name: lab28-gateway
    static_configs: [{targets: ["gateway:9901"]}]
    metrics_path: /stats/prometheus

  - job_name: lab28-kafka
    static_configs: [{targets: ["kafka-exporter:9308"]}]

  - job_name: lab28-airflow-batch
    static_configs: [{targets: ["pushgateway:9091"]}]

  - job_name: lab28-qdrant
    static_configs: [{targets: ["qdrant:6333"]}]
    metrics_path: /metrics

  - job_name: lab28-mlflow
    # MLflow has a health endpoint but no Prometheus exposition endpoint. The
    # API readiness probe publishes MLflow availability as
    # lab28_component_ready{component="mlflow"}; scrape that exporter under a
    # distinct job so target coverage and dependency health stay separate.
    static_configs: [{targets: ["api:8000"]}]
    metrics_path: /metrics

  - job_name: lab28-feast
    static_configs: [{targets: ["feast:8000"]}]
    metrics_path: /metrics

  - job_name: lab28-collector
    static_configs: [{targets: ["otel-collector:8888"]}]

  - job_name: lab28-prometheus
    static_configs: [{targets: ["prometheus:9090"]}]

  - job_name: lab28-vllm-optional
    # Endpoint suy luan co the o local hoac o xa (Kaggle/cluster), va hai truong
    # hop dung scheme khac nhau. Doc tu file_sd de doi dia chi ma khong phai sua
    # config nay; `__scheme__` cho phep dat http hay https theo tung target.
    file_sd_configs:
      - files: [/etc/prometheus/targets/vllm.json]
    metrics_path: /metrics
